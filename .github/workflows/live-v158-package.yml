name: Live v1.5.8 patched package

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  patched-five-real:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download v1.5.7 package
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/luxomarket/consulta-cdc-contable-updates/releases/download/v1.5.7/Consulta_CDC_Contable_v1.5.7_UPDATE.zip' -OutFile "$env:RUNNER_TEMP\pkg.zip"
          Expand-Archive "$env:RUNNER_TEMP\pkg.zip" "$env:RUNNER_TEMP\pkg" -Force
      - name: Apply critical v1.5.8 CDP correction
        shell: pwsh
        run: |
          $p="$env:RUNNER_TEMP\pkg\app\services\direct_provider.py"
          $s=Get-Content $p -Raw -Encoding UTF8
          $s=$s.Replace('deadline = time.monotonic() + min(max(self.timeout, 4.0), 10.0)','deadline = time.monotonic() + min(max(self.timeout, 12.0), 20.0)')
          $needle="            if self._browser_process.poll() is not None:`n                raise ProviderNotConfigured(`"El navegador local se cerró antes de iniciar el canal de consulta`")`n"
          if (-not $s.Contains($needle)) { throw 'No se encontro el falso-fatal de v1.5.7' }
          $s=$s.Replace($needle,'')
          Set-Content $p $s -Encoding UTF8
          $cfg="$env:RUNNER_TEMP\pkg\app\config.py"
          $c=Get-Content $cfg -Raw -Encoding UTF8
          Set-Content $cfg ($c.Replace('app_version: str = "1.5.7"','app_version: str = "1.5.8"')) -Encoding UTF8
          Set-Content "$env:RUNNER_TEMP\pkg\VERSION.txt" '1.5.8' -Encoding ASCII
      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}/pkg
        run: pip install -r requirements.txt
      - name: Check provider DNS
        shell: pwsh
        run: |
          $ok=$false
          1..8 | ForEach-Object {
            try { Resolve-DnsName cdc.siscotic.com.py -ErrorAction Stop | Out-Host; $ok=$true; break }
            catch { Write-Host "DNS intento $_ fallo"; Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { throw 'DNS del proveedor no disponible desde el runner' }
      - name: Query five real CDCs through patched package
        shell: pwsh
        working-directory: ${{ runner.temp }}/pkg
        env:
          SISCOTIC_BROWSER_PRIMARY_ENABLED: 'true'
          SISCOTIC_BROWSER_FALLBACK_ENABLED: 'true'
          SISCOTIC_HTTP_DIRECT_ENABLED: 'true'
        run: python tools/test_multifuente_5_real.py
