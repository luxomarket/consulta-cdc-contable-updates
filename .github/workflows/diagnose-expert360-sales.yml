name: Diagnose Expert360 linked document

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  diagnose-sales:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect linked-document fields for NC
        shell: pwsh
        run: |
          @'
          import json, urllib.parse, urllib.request
          BASE='https://api.expert360.com.py'
          CDC='05801146216001001000193122026083111093297972'
          H={'Accept':'application/json','Referer':'https://expert360.com.py/','User-Agent':'Mozilla/5.0'}
          def get(ep):
            qs=urllib.parse.urlencode({'cdc':CDC,'agrupar':'false'})
            req=urllib.request.Request(BASE+ep+'?'+qs,headers=H)
            with urllib.request.urlopen(req,timeout=25) as r:
              return r.status,json.loads(r.read().decode('utf-8','replace'))
          for ep in ('/api/compra','/api/venta'):
            print('\nENDPOINT',ep)
            try:
              status,p=get(ep)
              print('STATUS',status)
              for k in sorted(p):
                kl=k.lower()
                if any(x in kl for x in ('vincu','asoc','relac','ref','fec','fecha','tim','cmpnro','comprobante','cdc')):
                  v=p.get(k)
                  if isinstance(v,(str,int,float,bool)) or v is None:
                    print(k,'=',repr(v))
              for list_key in ('egreDet','ingDet'):
                rows=p.get(list_key) or []
                if isinstance(rows,list):
                  for i,row in enumerate(rows[:5]):
                    if isinstance(row,dict):
                      for k in sorted(row):
                        kl=k.lower()
                        if any(x in kl for x in ('vincu','asoc','relac','ref','fec','fecha','tim','cmpnro','comprobante','cdc')):
                          v=row.get(k)
                          if isinstance(v,(str,int,float,bool)) or v is None:
                            print(f'{list_key}[{i}].{k}=',repr(v))
            except Exception as e:
              print('ERROR',type(e).__name__,str(e)[:200])
          '@ | Set-Content $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
