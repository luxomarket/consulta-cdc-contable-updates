name: Diagnose Expert360 full NC record

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  diagnose-sales:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe likely full-record routes for nonempty association
        shell: pwsh
        run: |
          @'
          import json, urllib.parse, urllib.request, urllib.error
          CDC='05801146216001001000193122026083111093297972'
          BASE='https://api.expert360.com.py'
          H={'Accept':'application/json','Referer':'https://expert360.com.py/','User-Agent':'Mozilla/5.0'}
          def get(url):
            req=urllib.request.Request(url,headers=H)
            with urllib.request.urlopen(req,timeout=15) as r:
              raw=r.read().decode('utf-8','replace')
              return r.status,json.loads(raw)
          base_objs={}
          for ep in ('compra','venta'):
            try:
              st,obj=get(BASE+'/api/'+ep+'?'+urllib.parse.urlencode({'cdc':CDC,'agrupar':'false'}))
              base_objs[ep]=obj
              rid=obj.get('egreid') if ep=='compra' else obj.get('ingid')
              print(ep.upper(),'BASE_STATUS',st,'HAS_ID',bool(rid),'VINC_NONEMPTY',bool(obj.get('egrecmpnrovincu') or obj.get('ingcmpnrovincu')))
              candidates=[]
              if rid is not None:
                candidates += [
                  f'/api/{ep}/{rid}',
                  f'/api/{ep}?id={urllib.parse.quote(str(rid))}',
                  f'/api/{ep}/detalle?id={urllib.parse.quote(str(rid))}',
                  f'/api/{ep}/get?id={urllib.parse.quote(str(rid))}',
                ]
              for path in candidates:
                try:
                  s,o=get(BASE+path)
                  vinc=''
                  if isinstance(o,dict): vinc=str(o.get('egrecmpnrovincu') or o.get('ingcmpnrovincu') or '')
                  print('ROUTE',path,'STATUS',s,'TYPE',type(o).__name__,'VINC_NONEMPTY',bool(vinc))
                  if isinstance(o,dict):
                    vals=[]
                    for k,v in o.items():
                      if isinstance(v,(str,int,float)) and v:
                        kl=k.lower()
                        if any(x in kl for x in ('vinc','relac','asoc','ref','cmptim','cmpnro')):
                          vals.append((k, bool(str(v).strip())))
                    if vals: print('ASSOC_KEYS',vals)
                except urllib.error.HTTPError as e:
                  print('ROUTE',path,'HTTP',e.code)
                except Exception as e:
                  print('ROUTE',path,'ERROR',type(e).__name__)
            except Exception as e:
              print(ep.upper(),'BASE_ERROR',type(e).__name__)
          '@ | Set-Content $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
