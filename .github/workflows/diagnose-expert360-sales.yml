name: Diagnose hidden linked-document fields

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  diagnose-sales:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect all scalar fields for document/date patterns
        shell: pwsh
        run: |
          @'
          import json, re, urllib.parse, urllib.request
          CDC='05801146216001001000193122026083111093297972'
          BASE='https://api.expert360.com.py'
          H={'Accept':'application/json','Referer':'https://expert360.com.py/','User-Agent':'Mozilla/5.0'}
          current_doc='001-001-0001931'
          current_date='2026-08-31'
          def walk(x,path='root'):
            if isinstance(x,dict):
              for k,v in x.items(): yield from walk(v,path+'.'+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): yield from walk(v,f'{path}[{i}]')
            else:
              yield path,x
          for ep in ('/api/compra','/api/venta'):
            u=BASE+ep+'?'+urllib.parse.urlencode({'cdc':CDC,'agrupar':'false'})
            req=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(req,timeout=25) as r:
              obj=json.loads(r.read().decode('utf-8','replace'))
            print('\nENDPOINT',ep,'STATUS',r.status)
            for path,val in walk(obj):
              s='' if val is None else str(val).strip()
              if not s: continue
              docs=re.findall(r'\b\d{3}-\d{3}-\d{7}\b',s)
              dates=re.findall(r'\b20\d{2}-\d{2}-\d{2}\b',s)
              cdcs=re.findall(r'\b\d{44}\b',s)
              docs=[d for d in docs if d!=current_doc]
              dates=[d for d in dates if d!=current_date]
              cdcs=[c for c in cdcs if c!=CDC]
              if docs or dates or cdcs:
                print('MATCH',path,'DOCS',docs,'DATES',dates,'CDCS',cdcs)
          '@ | Set-Content $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
