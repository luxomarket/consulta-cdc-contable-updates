name: Diagnose Expert360 public endpoints

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  diagnose-sales:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public JS for API endpoint names
        shell: pwsh
        run: |
          @'
          import re, urllib.parse, urllib.request
          bases=['https://expert360.com.py/','https://api.expert360.com.py/']
          H={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,*/*'}
          seen=set()
          for base in bases:
            try:
              req=urllib.request.Request(base,headers=H)
              with urllib.request.urlopen(req,timeout=25) as r:
                text=r.read().decode('utf-8','replace')
                final=r.geturl()
              print('BASE',base,'FINAL',final,'LEN',len(text))
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
              for src in scripts[:50]:
                u=urllib.parse.urljoin(final,src)
                if u in seen: continue
                seen.add(u)
                try:
                  req=urllib.request.Request(u,headers=H)
                  with urllib.request.urlopen(req,timeout=25) as rr:
                    js=rr.read().decode('utf-8','replace')
                  hits=sorted(set(re.findall(r'["\']([^"\']*/api/[^"\']+)["\']',js)))
                  filt=[h for h in hits if any(x in h.lower() for x in ('compra','venta','xml','cdc','document','dte','factura','nota'))]
                  if filt:
                    print('SCRIPT',u)
                    for h in filt[:80]: print(' API',h[:220])
                except Exception as e:
                  pass
            except Exception as e:
              print('BASE_ERROR',base,type(e).__name__,str(e)[:120])
          '@ | Set-Content $env:RUNNER_TEMP\scan.py -Encoding utf8
          python $env:RUNNER_TEMP\scan.py
