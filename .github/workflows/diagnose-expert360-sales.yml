name: Diagnose linked document from official QR

on:
  push:
    branches:
      - diagnostic/siscotic-live-20260826

permissions:
  contents: read

jobs:
  diagnose-sales:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Expert QR and inspect official response for association data
        shell: pwsh
        run: |
          @'
          import json, re, urllib.parse, urllib.request
          CDC='05801146216001001000193122026083111093297972'
          H={'Accept':'application/json,text/html,*/*','Referer':'https://expert360.com.py/','User-Agent':'Mozilla/5.0'}
          api='https://api.expert360.com.py/api/compra?'+urllib.parse.urlencode({'cdc':CDC,'agrupar':'false'})
          req=urllib.request.Request(api,headers=H)
          with urllib.request.urlopen(req,timeout=25) as r:
            data=json.loads(r.read().decode('utf-8','replace'))
          qr=str(data.get('dcarQR') or data.get('dCarQR') or '').replace('&amp;','&')
          print('QR_PRESENT',bool(qr),'QR_HOST',urllib.parse.urlparse(qr).netloc,'QR_PATH',urllib.parse.urlparse(qr).path)
          if not qr: raise SystemExit(2)
          req=urllib.request.Request(qr,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r:
            body=r.read().decode('utf-8','replace'); ct=r.headers.get('content-type'); final=r.geturl()
          print('OFFICIAL_STATUS',r.status,'CT',ct,'LEN',len(body),'FINAL_HOST',urllib.parse.urlparse(final).netloc)
          low=body.lower()
          for token in ('documento asociado','factura relacionada','dcdcde','dcdcdeRef'.lower(),'gcamdeasoc','documento relacionado','referenciado'):
            print('HAS',token,token in low)
          text=re.sub(r'<script.*?</script>',' ',body,flags=re.I|re.S)
          text=re.sub(r'<style.*?</style>',' ',text,flags=re.I|re.S)
          text=re.sub(r'<[^>]+>',' ',text)
          text=re.sub(r'\s+',' ',text)
          for term in ('asociado','relacionado','referenciado','factura'):
            m=re.search(r'.{0,120}'+term+r'.{0,220}',text,re.I)
            if m: print('TEXT_MATCH',term,m.group(0)[:360])
          '@ | Set-Content $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
