name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test stack
        run: pip install 'requests>=2.32,<3' 'playwright>=1.50,<2'
      - name: Test exact CDC with direct transports and Edge UI
        shell: pwsh
        run: |
          @'
          import json, os, subprocess, time, requests
          from playwright.sync_api import sync_playwright
          HOME='https://cdc.siscotic.com.py/'
          API=HOME+'api/consultar'
          CDC='01800228774735001003321522026080112808168839'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          headers={'User-Agent':UA,'Accept':'application/json, text/plain, */*','Accept-Language':'es-PY,es;q=0.9,en;q=0.8','Referer':HOME,'Cache-Control':'no-cache','Pragma':'no-cache'}
          def check(label,status,text,elapsed):
              try: p=json.loads(text)
              except Exception: p={}
              ok=status==200 and p.get('success') is True and p.get('cdc')==CDC and isinstance(p.get('data'),dict)
              print(label,'STATUS',status,'ELAPSED',round(elapsed,3),'OK',ok,'BODY',text[:300])
              return ok
          results={}
          s=requests.Session(); s.headers.update(headers)
          t=time.monotonic(); r=s.get(API,params={'cdc':CDC},timeout=20,allow_redirects=True); results['requests']=check('REQUESTS',r.status_code,r.text,time.monotonic()-t)
          root=os.environ.get('SystemRoot') or r'C:\Windows'; curl=os.path.join(root,'System32','curl.exe'); url=API+'?cdc='+CDC
          cmd=[curl,'-sS','-L','--max-time','20','-w','\n__HTTP__%{http_code}',url,'-H',f'User-Agent: {UA}','-H','Accept: application/json, text/plain, */*','-H',f'Referer: {HOME}']
          t=time.monotonic(); cp=subprocess.run(cmd,capture_output=True,text=True,encoding='utf-8',errors='replace'); out=cp.stdout; marker='\n__HTTP__'; body,code=(out.rsplit(marker,1) if marker in out else (out,'0')); results['curl']=check('CURL',int(code.strip() or 0),body,time.monotonic()-t)
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(channel='msedge',headless=True)
                  page=browser.new_page(locale='es-PY',viewport={'width':1280,'height':900})
                  page.set_default_timeout(25000); page.goto(HOME,wait_until='domcontentloaded',timeout=25000)
                  field=page.locator('#searchInput')
                  field.fill(CDC)
                  t=time.monotonic()
                  with page.expect_response(lambda resp: '/api/consultar' in resp.url, timeout=25000) as info:
                      page.locator('button[type="submit"]').click()
                  resp=info.value; text=resp.text(); results['edge_ui']=check('EDGE_UI',resp.status,text,time.monotonic()-t)
                  browser.close()
          except Exception as exc:
              print('EDGE_UI_EXCEPTION',repr(exc)); results['edge_ui']=False
          print('RESULTS',results)
          assert results['edge_ui'] or results['requests'] or results['curl'], 'all transports blocked'
          print('LIVE_FALLBACK_MATRIX_OK')
          '@ | Set-Content -Path $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
