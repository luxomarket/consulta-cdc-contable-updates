name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-linked-installer-browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser stack
        run: pip install 'playwright>=1.50,<2'
      - name: Validate v1.5.7 fresh profile and restart
        shell: pwsh
        run: |
          @'
          import json, os, re, socket, subprocess, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          HOME='https://cdc.siscotic.com.py/'
          CASES=[
            ('USER_FAILING','01800228774735001003321522026080112808168839'),
            ('NCE','05800018125001004001467712025050917914375148'),
            ('BIGGIE','01800774060069002030118622026080214930621220'),
          ]
          PROFILE=Path(os.environ['RUNNER_TEMP'])/'cdc-v157-profile'
          PROFILE.mkdir(parents=True,exist_ok=True)

          def find_edge():
            candidates=[Path(os.environ.get('PROGRAMFILES(X86)',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe',Path(os.environ.get('PROGRAMFILES',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe']
            return next((p for p in candidates if p.is_file()),None)

          def free_port():
            with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as s:
              s.bind(('127.0.0.1',0)); return s.getsockname()[1]

          def cleanup_locks():
            for name in ('SingletonLock','SingletonCookie','SingletonSocket'):
              try: (PROFILE/name).unlink(missing_ok=True)
              except Exception: pass

          def wait_form(page, timeout=30):
            deadline=time.monotonic()+timeout; reloaded=False; last=''
            while time.monotonic()<deadline:
              loc=page.locator('#searchInput')
              if loc.count() and loc.first.is_visible(): return loc.first
              try: last=page.locator('body').inner_text(timeout=1000)
              except Exception: last=''
              low=' '.join(last.lower().split())
              if ('recaptcha' in low or 'no soy un robot' in low or ('captcha' in low and 'imunify' not in low)):
                raise RuntimeError('interactive captcha: '+last[:300])
              page.wait_for_timeout(250)
              if not reloaded and time.monotonic()>deadline-20:
                try: page.reload(wait_until='domcontentloaded',timeout=30000); reloaded=True
                except Exception: pass
            raise RuntimeError('form not ready: '+last[:600])

          def launch():
            cleanup_locks(); exe=find_edge(); assert exe
            port=free_port()
            args=[str(exe),f'--remote-debugging-port={port}',f'--user-data-dir={PROFILE}','--no-first-run','--no-default-browser-check','--start-minimized','about:blank']
            si=subprocess.STARTUPINFO(); si.dwFlags|=subprocess.STARTF_USESHOWWINDOW; si.wShowWindow=6
            proc=subprocess.Popen(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,stdin=subprocess.DEVNULL,creationflags=getattr(subprocess,'CREATE_NEW_PROCESS_GROUP',0),startupinfo=si)
            ep=f'http://127.0.0.1:{port}/json/version'; deadline=time.monotonic()+12
            while time.monotonic()<deadline:
              try:
                with urllib.request.urlopen(ep,timeout=.5) as rr:
                  if json.loads(rr.read().decode()).get('webSocketDebuggerUrl'): break
              except Exception: time.sleep(.1)
            else: raise RuntimeError('CDP timeout')
            pw=sync_playwright().start(); browser=pw.chromium.connect_over_cdp(f'http://127.0.0.1:{port}',timeout=20000)
            ctx=browser.contexts[0]; page=ctx.pages[0]; page.set_default_timeout(30000); page.set_default_navigation_timeout(30000)
            return proc,pw,browser,ctx,page

          def close_all(proc,pw,browser):
            try: browser.close()
            except Exception: pass
            try: pw.stop()
            except Exception: pass
            try:
              if proc.poll() is None:
                subprocess.run(['taskkill','/PID',str(proc.pid),'/T','/F'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=8)
            except Exception: pass
            time.sleep(.5)

          def query(page,label,cdc):
            if page.url=='about:blank' or 'cdc.siscotic.com.py' not in page.url:
              page.goto(HOME,wait_until='domcontentloaded',timeout=30000)
            field=wait_form(page)
            try:
              b=page.get_by_role('button',name=re.compile(r'Ahora no',re.I))
              if b.count() and b.first.is_visible(): b.first.click(timeout=800)
            except Exception: pass
            field.fill(cdc); started=time.monotonic()
            with page.expect_response(lambda r:'/api/consultar' in r.url,timeout=30000) as info:
              page.get_by_role('button',name=re.compile(r'^\s*Consultar\s*$',re.I)).first.click()
            resp=info.value; payload=json.loads(resp.text()); elapsed=round(time.monotonic()-started,3)
            d=payload.get('data') or {}
            row={'label':label,'status':resp.status,'elapsed':elapsed,'success':payload.get('success'),'emisor':d.get('emisor',{}).get('razon_social'),'doc':d.get('timbrado',{}).get('numero_documento'),'total':d.get('liquidaciones_iva',{}).get('total_general')}
            print('ROW',json.dumps(row,ensure_ascii=False))
            assert resp.status==200 and payload.get('success') is True and row['emisor'] and row['doc'] and row['total'] is not None,row
            return row

          proc=pw=browser=None
          try:
            proc,pw,browser,ctx,page=launch(); page.goto(HOME,wait_until='domcontentloaded',timeout=30000); wait_form(page)
            query(page,*CASES[0]); query(page,*CASES[1])
            print('COOKIES_AFTER_FIRST',len(ctx.cookies()))
          finally:
            if proc: close_all(proc,pw,browser)

          proc=pw=browser=None
          try:
            proc,pw,browser,ctx,page=launch(); page.goto(HOME,wait_until='domcontentloaded',timeout=30000); wait_form(page)
            query(page,*CASES[2])
            print('V157_FRESH_AND_RESTART_OK')
          finally:
            if proc: close_all(proc,pw,browser)
          '@ | Set-Content -Path $env:RUNNER_TEMP\probe_v157.py -Encoding utf8
          python $env:RUNNER_TEMP\probe_v157.py
