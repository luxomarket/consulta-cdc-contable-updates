name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Probe direct public API with browser-compatible headers
        run: |
          cat > /tmp/probe.py <<'PY'
          import requests, json, time

          BASE = 'https://cdc.siscotic.com.py/'
          API = 'https://cdc.siscotic.com.py/api/consultar'
          CDCS = [
              # Ejemplos publicados por terceros en documentación pública.
              '01800695631001001000000612021112917595714694',
              '01800695631001002100732012024072311932227581',
              '01800268520001001000000422024082310845861483',
          ]
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'es-PY,es;q=0.9,en;q=0.8',
              'Referer': BASE,
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          }

          s = requests.Session()
          s.headers.update(headers)
          t0 = time.monotonic()
          r0 = s.get(BASE, timeout=10)
          print('HOME', r0.status_code, r0.url, 'cookies', dict(s.cookies))
          rt = s.get(BASE + 'api/test', timeout=10)
          print('TEST', rt.status_code, rt.text[:500])

          for cdc in CDCS:
              start = time.monotonic()
              r = s.get(API, params={'cdc': cdc}, timeout=10)
              elapsed = time.monotonic() - start
              print('CDC', cdc, 'STATUS', r.status_code, 'ELAPSED', round(elapsed, 3), 'CTYPE', r.headers.get('content-type'))
              print('BODY', r.text[:4000])
              try:
                  payload = r.json()
                  if isinstance(payload, dict):
                      print('JSON_KEYS', sorted(payload.keys()))
                      data = payload.get('data')
                      if isinstance(data, dict):
                          print('DATA_KEYS', sorted(data.keys()))
              except Exception as exc:
                  print('JSON_ERROR', repr(exc))
          print('TOTAL', round(time.monotonic()-t0, 3))
          PY
          python /tmp/probe.py
