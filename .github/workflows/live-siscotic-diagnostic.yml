name: Live DNIT FX diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dnit-fx-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: pip install 'requests>=2.32,<3' 'lxml>=5,<7'
      - name: Fetch and parse official DNIT exchange rates
        shell: pwsh
        run: |
          @'
          import re, json
          from datetime import date
          import requests
          from lxml import html

          URL='https://www.dnit.gov.py/web/portal-institucional/search?delta=60&q=Tipos%20de%20cambios%20del%20mes%20de%20Agosto%202026'
          r=requests.get(URL,timeout=30,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'es-PY,es;q=0.9'})
          print('HTTP',r.status_code,'LEN',len(r.text),'URL',r.url)
          r.raise_for_status()
          doc=html.fromstring(r.content)
          rows=[]
          for tr in doc.xpath('//tr'):
            cells=[' '.join(c.text_content().split()) for c in tr.xpath('./th|./td')]
            if len(cells)>=13 and re.fullmatch(r'\d{1,2}',cells[0]):
              rows.append(cells)
          print('ROWS',len(rows))
          assert rows, 'No se encontró la tabla oficial de cotizaciones'
          def num(s): return float(s.replace('.','').replace(',','.'))
          rates={int(row[0]): {'usd_buy':num(row[1]),'usd_sell':num(row[2])} for row in rows}
          print('RATE_01',rates.get(1))
          print('RATE_07',rates.get(7))
          assert rates[1]['usd_buy']==5959.05 and rates[1]['usd_sell']==5970.96
          assert rates[7]['usd_buy']==5952.13 and rates[7]['usd_sell']==5953.04
          print('DNIT_FX_OFFICIAL_PAGE_OK')
          '@ | Set-Content -Path $env:RUNNER_TEMP\dnit_fx_probe.py -Encoding utf8
          python $env:RUNNER_TEMP\dnit_fx_probe.py
