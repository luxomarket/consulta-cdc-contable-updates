name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-edge-flags:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: pip install 'playwright>=1.50,<2'
      - name: Validate production native Edge flags
        shell: pwsh
        run: |
          @'
          import json, os, re, socket, subprocess, tempfile, threading, time, urllib.request
          from pathlib import Path
          HOME='https://cdc.siscotic.com.py/'
          CASES=[('USER','01800228774735001003321522026080112808168839'),('NCE','05800018125001004001467712025050917914375148')]
          result={'ok':False,'rows':[],'error':None}
          def worker():
            proc=pw=browser=None
            profile=Path(tempfile.mkdtemp(prefix='cdc-prod-edge-'))
            try:
              candidates=[Path(os.environ.get('PROGRAMFILES(X86)',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe',Path(os.environ.get('PROGRAMFILES',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe']
              exe=next((p for p in candidates if p.is_file()),None); assert exe
              with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock: sock.bind(('127.0.0.1',0)); port=sock.getsockname()[1]
              args=[str(exe),f'--remote-debugging-port={port}',f'--user-data-dir={profile}','--no-first-run','--no-default-browser-check','--disable-background-networking','--disable-component-update','--disable-features=Translate,MediaRouter','--window-position=-32000,-32000','--window-size=1200,900','--start-minimized','about:blank']
              si=subprocess.STARTUPINFO(); si.dwFlags |= subprocess.STARTF_USESHOWWINDOW; si.wShowWindow=6
              proc=subprocess.Popen(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,stdin=subprocess.DEVNULL,creationflags=getattr(subprocess,'CREATE_NEW_PROCESS_GROUP',0),startupinfo=si)
              ep=f'http://127.0.0.1:{port}/json/version'; deadline=time.monotonic()+10
              while time.monotonic()<deadline:
                try:
                  with urllib.request.urlopen(ep,timeout=.35) as rr:
                    if json.loads(rr.read().decode()).get('webSocketDebuggerUrl'): break
                except Exception: time.sleep(.08)
              else: raise RuntimeError('CDP timeout')
              from playwright.sync_api import sync_playwright
              pw=sync_playwright().start(); browser=pw.chromium.connect_over_cdp(f'http://127.0.0.1:{port}',timeout=20000)
              context=browser.contexts[0]; page=context.pages[0]; page.set_default_timeout(20000); page.set_default_navigation_timeout(20000)
              page.goto(HOME,wait_until='domcontentloaded',timeout=20000)
              try:
                b=page.get_by_role('button',name=re.compile(r'Ahora no',re.I));
                if b.count() and b.first.is_visible(): b.first.click(timeout=700)
              except Exception: pass
              for label,cdc in CASES:
                page.locator('#searchInput').fill(cdc); t=time.monotonic()
                with page.expect_response(lambda resp:'/api/consultar' in resp.url,timeout=20000) as info:
                  page.get_by_role('button',name=re.compile(r'^\s*Consultar\s*$',re.I)).first.click()
                resp=info.value; payload=json.loads(resp.text()); elapsed=time.monotonic()-t
                ok=resp.status==200 and payload.get('success') is True and isinstance(payload.get('data'),dict)
                d=payload.get('data') or {}
                row={'label':label,'status':resp.status,'elapsed':round(elapsed,3),'ok':ok,'emisor':d.get('emisor',{}).get('razon_social'),'doc':d.get('timbrado',{}).get('numero_documento'),'total':d.get('liquidaciones_iva',{}).get('total_general')}
                print('ROW',json.dumps(row,ensure_ascii=False)); result['rows'].append(row)
                assert ok and row['emisor'] and row['doc'] and row['total'] is not None
              result['ok']=True
            except Exception as exc: result['error']=repr(exc)
            finally:
              try:
                if browser: browser.close()
              except Exception: pass
              try:
                if pw: pw.stop()
              except Exception: pass
              try:
                if proc and proc.poll() is None: proc.terminate()
              except Exception: pass
          th=threading.Thread(target=worker,daemon=True); th.start(); th.join(90)
          print('FINAL',json.dumps(result,ensure_ascii=False))
          assert not th.is_alive() and result['ok'], result
          print('PRODUCTION_EDGE_FLAGS_OK')
          '@ | Set-Content -Path $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py
