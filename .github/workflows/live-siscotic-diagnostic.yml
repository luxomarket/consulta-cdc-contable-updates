name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe public CDC form with published example
        run: |
          cat > /tmp/probe.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, time, re

          URL = 'https://cdc.siscotic.com.py/'
          # CDC published publicly in FacturaSend documentation.
          CDC = '01800695631001001000000612021112917595714694'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(locale='es-PY', viewport={'width': 1280, 'height': 900})
              page.set_default_timeout(12000)
              page.set_default_navigation_timeout(12000)
              captures = []

              def on_response(resp):
                  try:
                      if resp.request.resource_type not in {'xhr','fetch','document'}:
                          return
                      ct = (resp.headers.get('content-type') or '').lower()
                      item = {'url': resp.url, 'status': resp.status, 'type': resp.request.resource_type, 'content_type': ct}
                      if resp.request.resource_type in {'xhr','fetch'}:
                          try:
                              txt = resp.text()
                              item['body_head'] = txt[:1200]
                          except Exception as exc:
                              item['body_error'] = str(exc)
                      captures.append(item)
                      print('RESPONSE', json.dumps(item, ensure_ascii=False))
                  except Exception as exc:
                      print('RESPONSE_HANDLER_ERROR', repr(exc))

              page.on('response', on_response)
              print('NAVIGATE', URL)
              r = page.goto(URL, wait_until='domcontentloaded')
              print('PAGE_STATUS', r.status if r else None)
              print('TITLE', page.title())
              print('URL_FINAL', page.url)

              # Close the optional contact modal through its normal UI.
              try:
                  btn = page.get_by_role('button', name=re.compile(r'Ahora no', re.I))
                  if btn.count() and btn.first.is_visible():
                      btn.first.click(timeout=1500)
                      print('MODAL_CLOSED')
              except Exception as exc:
                  print('MODAL_CLOSE_WARN', repr(exc))

              inputs = page.locator('input[placeholder*="CDC" i], input[maxlength="44"], input[name*="cdc" i]')
              print('INPUT_COUNT', inputs.count())
              if inputs.count() == 0:
                  print('BODY', page.locator('body').inner_text()[:5000])
                  raise SystemExit('NO_CDC_INPUT')
              field = inputs.first
              field.fill(CDC)
              print('INPUT_VALUE', field.input_value())

              buttons = page.get_by_role('button', name=re.compile(r'^\s*Consultar\s*$', re.I))
              print('BUTTON_COUNT', buttons.count())
              if buttons.count():
                  buttons.first.click()
              else:
                  field.press('Enter')

              started = time.monotonic()
              last_body = ''
              while time.monotonic() - started < 12:
                  page.wait_for_timeout(200)
                  body = page.locator('body').inner_text()
                  last_body = body
                  low = body.lower()
                  if CDC in body or any(x in low for x in ['razon social', 'razón social']):
                      # Check whether result placeholders have been replaced.
                      if 'tipo de documento\n-' not in low and 'total general\n-' not in low:
                          break
              elapsed = time.monotonic() - started
              print('ELAPSED_SECONDS', round(elapsed, 3))
              print('BODY_AFTER_START')
              print(last_body[:10000])
              print('BODY_AFTER_END')
              print('CAPTURE_COUNT', len(captures))
              browser.close()
          PY
          python /tmp/probe.py
