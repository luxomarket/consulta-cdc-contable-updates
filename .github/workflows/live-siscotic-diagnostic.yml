name: Live SisCoTic v1.5.8 diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-browser-matrix:
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.50,<2'
      - name: Validate exact v1.5.8 launch and query
        shell: pwsh
        run: |
          @'
          import json, os, re, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          HOME='https://cdc.siscotic.com.py/'
          CDC='01800228774735001003321522026080112808168839'
          profile=Path(tempfile.mkdtemp(prefix='cdc-v158-'))
          candidates=[Path(os.environ.get('PROGRAMFILES(X86)',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe',Path(os.environ.get('PROGRAMFILES',''))/'Microsoft'/'Edge'/'Application'/'msedge.exe',Path(os.environ.get('PROGRAMFILES',''))/'Google'/'Chrome'/'Application'/'chrome.exe']
          exe=next((p for p in candidates if p.is_file()),None); assert exe, 'No browser'
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as s: s.bind(('127.0.0.1',0)); port=s.getsockname()[1]
          args=[str(exe),f'--remote-debugging-port={port}',f'--user-data-dir={profile}','--no-first-run','--no-default-browser-check','--disable-background-networking','--disable-component-update','--disable-features=Translate,MediaRouter','--window-position=-32000,-32000','--window-size=1200,900','--start-minimized','about:blank']
          si=subprocess.STARTUPINFO(); si.dwFlags |= subprocess.STARTF_USESHOWWINDOW; si.wShowWindow=6
          proc=subprocess.Popen(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,stdin=subprocess.DEVNULL,creationflags=getattr(subprocess,'CREATE_NEW_PROCESS_GROUP',0),startupinfo=si)
          endpoint=f'http://127.0.0.1:{port}/json/version'; deadline=time.monotonic()+20; launcher_exit=None
          while time.monotonic()<deadline:
            try:
              with urllib.request.urlopen(endpoint,timeout=.45) as r:
                meta=json.loads(r.read().decode())
              if meta.get('webSocketDebuggerUrl'): break
            except Exception: pass
            if proc.poll() is not None: launcher_exit=proc.returncode
            time.sleep(.1)
          else: raise AssertionError(f'CDP unavailable launcher_exit={launcher_exit}')
          print('CDP_READY launcher_exit=',launcher_exit,'exe=',exe.name)
          pw=sync_playwright().start(); browser=pw.chromium.connect_over_cdp(f'http://127.0.0.1:{port}',timeout=20000)
          context=browser.contexts[0]; page=context.pages[0]; page.set_default_timeout(30000); page.set_default_navigation_timeout(30000)
          page.goto(HOME,wait_until='domcontentloaded',timeout=30000)
          deadline=time.monotonic()+30
          while time.monotonic()<deadline:
            field=page.locator('#searchInput')
            if field.count() and field.first.is_visible(): break
            page.wait_for_timeout(250)
          else: raise AssertionError('CDC field not available; body='+page.locator('body').inner_text()[:700])
          field.first.fill(CDC); t=time.monotonic()
          with page.expect_response(lambda r:'/api/consultar' in r.url,timeout=30000) as info:
            page.get_by_role('button',name=re.compile(r'^\s*Consultar\s*$',re.I)).first.click()
          resp=info.value; payload=json.loads(resp.text()); elapsed=time.monotonic()-t
          d=payload.get('data') or {}; ok=resp.status==200 and payload.get('success') is True and d.get('emisor',{}).get('razon_social')=='FARMA S.A.' and d.get('timbrado',{}).get('numero_documento')=='0033215' and d.get('liquidaciones_iva',{}).get('total_general')==372850
          print('RESULT',resp.status,round(elapsed,3),d.get('emisor',{}).get('razon_social'),d.get('timbrado',{}).get('numero_documento'),d.get('liquidaciones_iva',{}).get('total_general'))
          assert ok
          browser.close(); pw.stop()
          print('V158_NATIVE_OK')
          '@ | Set-Content $env:RUNNER_TEMP\probe.py -Encoding utf8
          python $env:RUNNER_TEMP\probe.py

  mixed-real-cdc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.50,<2'
      - name: Query eight real CDCs in one v1.5.8 browser session
        shell: pwsh
        run: |
          @'
          import json, os, re, socket, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          HOME='https://cdc.siscotic.com.py/'
          CASES=['01800228774735001003321522026080112808168839','05800018125001004001467712025050917914375148','01800268520001001000000422024082310845861483','01800774060069002030118622026080214930621220','01800005198001003858591122026081512010621690','01800140664045005028736522026080310859704441','01800032969008007005097122026080715911140787','01801021383001001000477022026061515772623429']
          profile=Path(tempfile.mkdtemp(prefix='cdc-v158-mixed-'))
          exe=Path(os.environ['PROGRAMFILES(X86)'])/'Microsoft'/'Edge'/'Application'/'msedge.exe'; assert exe.is_file()
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as s: s.bind(('127.0.0.1',0)); port=s.getsockname()[1]
          args=[str(exe),f'--remote-debugging-port={port}',f'--user-data-dir={profile}','--no-first-run','--no-default-browser-check','--disable-background-networking','--disable-component-update','--disable-features=Translate,MediaRouter','--window-position=-32000,-32000','--window-size=1200,900','--start-minimized','about:blank']
          si=subprocess.STARTUPINFO(); si.dwFlags |= subprocess.STARTF_USESHOWWINDOW; si.wShowWindow=6
          proc=subprocess.Popen(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,stdin=subprocess.DEVNULL,creationflags=getattr(subprocess,'CREATE_NEW_PROCESS_GROUP',0),startupinfo=si)
          ep=f'http://127.0.0.1:{port}/json/version'; deadline=time.monotonic()+20
          while time.monotonic()<deadline:
            try:
              with urllib.request.urlopen(ep,timeout=.45) as r:
                if json.loads(r.read().decode()).get('webSocketDebuggerUrl'): break
            except Exception: pass
            time.sleep(.1)
          else: raise AssertionError('CDP timeout')
          pw=sync_playwright().start(); browser=pw.chromium.connect_over_cdp(f'http://127.0.0.1:{port}',timeout=20000); context=browser.contexts[0]; page=context.pages[0]; page.set_default_timeout(30000); page.set_default_navigation_timeout(30000)
          page.goto(HOME,wait_until='domcontentloaded',timeout=30000)
          field=page.locator('#searchInput'); field.wait_for(state='visible',timeout=30000)
          ok=0
          for cdc in CASES:
            field.fill(cdc); t=time.monotonic()
            with page.expect_response(lambda r:'/api/consultar' in r.url,timeout=30000) as info: page.get_by_role('button',name=re.compile(r'^\s*Consultar\s*$',re.I)).first.click()
            resp=info.value; payload=json.loads(resp.text()); d=payload.get('data') or {}; found=resp.status==200 and payload.get('success') is True and d.get('emisor',{}).get('ruc') and d.get('timbrado',{}).get('numero_documento') and d.get('liquidaciones_iva',{}).get('total_general') is not None
            print('CASE',cdc,resp.status,round(time.monotonic()-t,3),d.get('timbrado',{}).get('tipo_documento'),d.get('emisor',{}).get('razon_social'),d.get('timbrado',{}).get('numero_documento'),d.get('liquidaciones_iva',{}).get('total_general'))
            assert found; ok+=1; page.wait_for_timeout(200)
          assert ok==len(CASES); print('V158_MIXED_8_OF_8_OK')
          browser.close(); pw.stop()
          '@ | Set-Content $env:RUNNER_TEMP\mixed.py -Encoding utf8
          python $env:RUNNER_TEMP\mixed.py
