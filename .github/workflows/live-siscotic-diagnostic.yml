name: Live SisCoTic diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install 'requests>=2.32,<3'
      - name: Diagnose exact CDC from user notebook
        run: |
          cat > /tmp/probe_user_cdc.py <<'PY'
          import json, time, requests

          HOME='https://cdc.siscotic.com.py/'
          TEST=HOME+'api/test'
          API=HOME+'api/consultar'
          USER_CDC='01800228774735001003321522026080112808168839'
          KNOWN_GOOD='01800268520001001000000422024082310845861483'
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'es-PY,es;q=0.9,en;q=0.8',
            'Referer':HOME,
            'Cache-Control':'no-cache',
            'Pragma':'no-cache',
          }

          def show(label, r, elapsed):
            print('\n===', label, '===')
            print('STATUS', r.status_code, 'ELAPSED', round(elapsed,3), 'CTYPE', r.headers.get('content-type'))
            print('URL', r.url)
            print('HEADERS', {k:v for k,v in r.headers.items() if k.lower() in ['server','cf-ray','x-powered-by','retry-after']})
            print('BODY', r.text[:5000])
            try:
              p=r.json(); print('JSON_KEYS', sorted(p.keys()) if isinstance(p,dict) else type(p).__name__)
              if isinstance(p,dict) and isinstance(p.get('data'),dict): print('DATA_KEYS', sorted(p['data'].keys()))
            except Exception as e: print('JSON_ERROR',repr(e))

          s=requests.Session(); s.headers.update(headers)
          t=time.monotonic(); r=s.get(HOME,timeout=15,allow_redirects=True); show('HOME',r,time.monotonic()-t)
          t=time.monotonic(); r=s.get(TEST,timeout=15,allow_redirects=True); show('TEST',r,time.monotonic()-t)

          for cdc,label in [(USER_CDC,'USER_CDC_FIRST'),(KNOWN_GOOD,'KNOWN_GOOD'),(USER_CDC,'USER_CDC_SECOND')]:
            t=time.monotonic()
            try:
              r=s.get(API,params={'cdc':cdc},timeout=20,allow_redirects=True)
              show(label,r,time.monotonic()-t)
            except Exception as e:
              print(label,'EXCEPTION',repr(e),'ELAPSED',round(time.monotonic()-t,3))

          # fresh session to distinguish provider/CDN state from session state
          s2=requests.Session(); s2.headers.update(headers)
          t=time.monotonic()
          try:
            r=s2.get(API,params={'cdc':USER_CDC},timeout=20,allow_redirects=True)
            show('USER_CDC_FRESH_SESSION',r,time.monotonic()-t)
          except Exception as e:
            print('USER_CDC_FRESH_SESSION EXCEPTION',repr(e),'ELAPSED',round(time.monotonic()-t,3))
          PY
          python /tmp/probe_user_cdc.py
